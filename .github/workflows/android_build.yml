name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: textile-mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: |
          cd textile-mobile
          npm install --legacy-peer-deps

      - name: Prebuild Android
        run: |
          cd textile-mobile
          npx expo prebuild --platform android --no-install

      - name: Build Android APK
        run: |
          cd textile-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gsg-mobile-apk
          path: textile-mobile/android/app/build/outputs/apk/release/app-release.apk
