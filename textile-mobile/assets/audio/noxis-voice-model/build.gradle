def archiveName = "noxis-voice-model"
def pomName = "Noxis Voice Intelligence"
def pomDescription = "Industrial voice processing model"

android {
    namespace "com.noxis.audio"
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 10
        versionName = version
        archivesBaseName = archiveName
    }
    buildFeatures {
        buildConfig = false
    }
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

tasks.register('genUUID') {
    def uuid = UUID.randomUUID().toString()
    def odir = file("$buildDir/generated/assets/model-en-us")
    def ofile = file("$odir/uuid")
    doLast {
        mkdir odir
        ofile.text = uuid
    }
}

preBuild.dependsOn(genUUID)

mavenPublishing {
    coordinates("com.noxis.audio", archiveName, version)
    pom {
        name = pomName
        description = pomDescription
    }
}
