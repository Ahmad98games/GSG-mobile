// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "27.2.12479018"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    // Redirect buildDir to a shorter path only for the "app" project to bypass Windows MAX_PATH (260 character limit) failures,
    // while keeping library build directories in their default paths to prevent breaking CMake native module linking.
    if (project.name == "app" && System.getProperty("os.name").toLowerCase().contains("windows")) {
        def shortName = project.name
        project.buildDir = new File("C:\\mobile system manager\\b\\${shortName}")
        if (project.hasProperty("layout")) {
            project.layout.buildDirectory.set(new File("C:\\mobile system manager\\b\\${shortName}"))
        }
    }

    def setNdk = {
        if (project.hasProperty('android')) {
            project.android {
                ndkVersion = "27.2.12479018"
            }
        }
    }
    if (project.state.executed) {
        setNdk()
    } else {
        project.afterEvaluate {
            setNdk()
        }
    }
}

